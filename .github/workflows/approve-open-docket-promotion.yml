name: attest-open-docket-promotion

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions: {}

concurrency:
  group: attest-open-docket-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify exact accepted-base promotion shape
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REVIEWED_HEAD: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          [[ "$actual_head" == "$REVIEWED_HEAD" ]]
          paths_file="${RUNNER_TEMP}/attestation-pr-paths.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --slurp > "$paths_file"
          python3 ops/classify_attestation_pr.py \
            --paths-file "$paths_file" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create short-lived review-gate App token
        if: steps.classify.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REVIEW_GATE_APP_ID }}
          private-key: ${{ secrets.REVIEW_GATE_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Sign the exact promotion receipt head
        if: steps.classify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWED_HEAD: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='independent-review' \
            -f head_sha="$REVIEWED_HEAD" \
            -f status='completed' \
            -f conclusion='success' \
            -f 'output[title]=Accepted-base promotion receipt validated' \
            -f "output[summary]=Promotion PR #${PR_NUMBER} passed accepted-base validation at exact receipt head ${REVIEWED_HEAD}. The App did not review evidence, write contents, or merge."
