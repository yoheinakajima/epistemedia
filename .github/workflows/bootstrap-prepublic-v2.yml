name: Promote validated Epistemedia pre-public tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-prepublic-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: epistemedia-prepublic-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'yoheinakajima/epistemedia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_TREE: 03bc33f8dc1de76abc871bfd23cd2e2f853bc623
      API_ROOT: https://api.github.com
    steps:
      - name: Fast-forward main and create a verification ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          repo="${GITHUB_REPOSITORY}"

          curl -fsS "${auth[@]}" "${API_ROOT}/repos/${repo}/git/trees/${TARGET_TREE}" >/dev/null
          current="$({ curl -fsS "${auth[@]}" "${API_ROOT}/repos/${repo}/git/ref/heads/main"; } | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

          payload="$(python - "$TARGET_TREE" "$current" <<'PY'
          import json, sys
          print(json.dumps({
              "message": "feat: publish validated Epistemedia pre-public implementation",
              "tree": sys.argv[1],
              "parents": [sys.argv[2]],
          }))
          PY
          )"
          commit="$({ curl -fsS -X POST "${auth[@]}" "${API_ROOT}/repos/${repo}/git/commits" -d "$payload"; } | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"

          ref_payload="$(python - "$commit" <<'PY'
          import json, sys
          print(json.dumps({"ref": "refs/heads/prepublic-ready", "sha": sys.argv[1]}))
          PY
          )"
          if ! curl -fsS -X POST "${auth[@]}" "${API_ROOT}/repos/${repo}/git/refs" -d "$ref_payload" >/dev/null; then
            patch="$(python - "$commit" <<'PY'
          import json, sys
          print(json.dumps({"sha": sys.argv[1], "force": True}))
          PY
          )"
            curl -fsS -X PATCH "${auth[@]}" "${API_ROOT}/repos/${repo}/git/refs/heads/prepublic-ready" -d "$patch" >/dev/null
          fi

          update="$(python - "$commit" <<'PY'
          import json, sys
          print(json.dumps({"sha": sys.argv[1], "force": False}))
          PY
          )"
          curl -fsS -X PATCH "${auth[@]}" "${API_ROOT}/repos/${repo}/git/refs/heads/main" -d "$update" >/dev/null

          issue="$(python - "$commit" "$TARGET_TREE" <<'PY'
          import json, sys
          print(json.dumps({
            "title": "[pre-public] Validated implementation promoted",
            "body": f"The one-shot bootstrap promoted commit `{sys.argv[1]}` with tested tree `{sys.argv[2]}`. The immutable verification ref is `prepublic-ready`. Repository visibility, Actions policy, Pages, releases, packages, and DNS remain owner-controlled and unactivated."
          }))
          PY
          )"
          curl -fsS -X POST "${auth[@]}" "${API_ROOT}/repos/${repo}/issues" -d "$issue" >/dev/null

          echo "commit=${commit}"
