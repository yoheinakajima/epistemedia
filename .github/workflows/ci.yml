name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Classify an untrusted docket-only submission
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          submission_only=false
          if [[ -n "$BASE_SHA" ]]; then
            mapfile -t changed < <(git -C candidate diff --name-only "$BASE_SHA...HEAD")
            if [[ ${#changed[@]} -gt 0 ]]; then
              submission_only=true
              for path in "${changed[@]}"; do
                if [[ ! "$path" =~ ^research/open-dockets/submissions/[^/]+/(PR_BODY\.md|intake\.json|proposal\.json)$ ]]; then
                  submission_only=false
                  break
                fi
              done
            fi
          fi
          echo "submission_only=$submission_only" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.classify.outputs.submission_only == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidate/pyproject.toml
      - name: Install
        if: steps.classify.outputs.submission_only != 'true'
        working-directory: candidate
        run: python -m pip install -e '.[dev]'
      - name: Validate, build, test, audit, and verify deterministic state
        if: steps.classify.outputs.submission_only != 'true'
        working-directory: candidate
        run: make check
      - name: Validate untrusted submission using accepted-base code
        if: steps.classify.outputs.submission_only == 'true'
        env:
          PYTHONPATH: validator/src
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python validator/ops/validate_submission_pr.py --candidate candidate --base-sha "$BASE_SHA"
