name: Bootstrap validated pre-public tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-prepublic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epistemedia-prepublic-bootstrap
  cancel-in-progress: false

jobs:
  promote-validated-tree:
    if: github.repository == 'yoheinakajima/epistemedia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_TREE: 03bc33f8dc1de76abc871bfd23cd2e2f853bc623
      API_ROOT: https://api.github.com
    steps:
      - name: Verify target tree and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          repo="${GITHUB_REPOSITORY}"

          curl -fsS "${auth[@]}" \
            "${API_ROOT}/repos/${repo}/git/trees/${TARGET_TREE}" >/dev/null

          current="$({ curl -fsS "${auth[@]}" \
            "${API_ROOT}/repos/${repo}/git/ref/heads/main"; } | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

          payload="$(python - "$TARGET_TREE" "$current" <<'PY'
          import json, sys
          print(json.dumps({
              "message": "feat: publish validated Epistemedia pre-public implementation",
              "tree": sys.argv[1],
              "parents": [sys.argv[2]],
          }))
          PY
          )"

          commit="$({ curl -fsS -X POST "${auth[@]}" \
            "${API_ROOT}/repos/${repo}/git/commits" \
            -d "$payload"; } | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"

          update="$(python - "$commit" <<'PY'
          import json, sys
          print(json.dumps({"sha": sys.argv[1], "force": False}))
          PY
          )"

          curl -fsS -X PATCH "${auth[@]}" \
            "${API_ROOT}/repos/${repo}/git/refs/heads/main" \
            -d "$update" >/dev/null

          echo "Promoted tree ${TARGET_TREE} as commit ${commit}."
