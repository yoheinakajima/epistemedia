[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "epistemedia"
version = "0.2.0"
description = "Knowledge that can show its work: a federated epistemic knowledge network for humans and agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Epistemedia contributors"}]
keywords = ["knowledge-graph", "provenance", "agents", "mcp", "epistemology", "event-sourcing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
server = ["uvicorn>=0.30"]

[project.scripts]
epistemedia = "epistemedia.cli:main"

[project.urls]
Homepage = "https://epistemedia.org"
Repository = "https://github.com/yoheinakajima/epistemedia"
Documentation = "https://epistemedia.org/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
